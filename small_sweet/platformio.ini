; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico]
build_src_filter = +<*> -<remote/> -<test/>
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_plus
; board = pico
framework = arduino
board_build.core = earlephilhower

monitor_speed = 115200

; 燒錄方式（挑一種，註解掉其他）：
; 1) 預設：編譯出 .uf2，自行複製到 RPI-RP2 磁碟
; 2) 已安裝 picotool 時可直接燒錄：
; upload_protocol = picotool

; Preserve the original ESC firmware in env:pico.
; Four brushed motors from src/main.txt + DBR4 bridge UART receiver.
[env:four_motor_rc]
extends = env:pico
board = pico
build_src_filter = -<*> +<remote/four_motor_rc.cpp>

; Temporary bench test: one TT motor on L9110, GP16/GP17. Not used by the car.
[env:tt_l9110_test]
extends = env:pico
board = pico
build_src_filter = -<*> +<test/tt_l9110_test.cpp>
